name: Build Linux Deps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Deps version (e.g., 1.3.0)'
        required: true
        type: string
      release_tag:
        description: 'Upload to this release tag (e.g., deps-v1.3.0). Leave empty to skip upload.'
        required: false
        type: string
      arch:
        description: 'Architecture to build'
        required: false
        type: choice
        options:
          - both
          - x64
          - arm64
        default: both

permissions:
  contents: write
  actions: read

jobs:
  # x64 ships in two CPU tiers (issue #92): v3 for x86-64-v3 CPUs, v2 for
  # anything older. Same script, one --tier switch.
  build-x64:
    if: ${{ inputs.arch == 'x64' || inputs.arch == 'both' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tier: [v3, v2]
    env:
      ASSET: VapourBox-deps-${{ inputs.version }}-linux-x64${{ matrix.tier == 'v2' && '-v2' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake nasm patchelf autoconf automake libtool \
            cython3 pkg-config gcc g++ python3-pip \
            libfftw3-dev libboost-filesystem-dev libboost-atomic-dev \
            ocl-icd-opencl-dev opencl-headers libdvdread-dev unzip
          # ubuntu-24.04 ships gcc 13 and Cython 3, which is what VapourSynth
          # R78 needs: float16_helper.h uses _Float16 in C++ (GCC >= 13),
          # averageframesfilter.cpp uses __builtin_roundevenf, and
          # vapoursynth.pyx uses Cython 3 syntax. On 22.04 none of those were
          # available and each had to be worked around separately.
          gcc --version | head -1
          pip3 install meson

      - name: Build dependencies (${{ matrix.tier }})
        run: ./Scripts/download-deps-linux.sh --force --tier ${{ matrix.tier }}

      - name: Package dependencies
        run: ./Scripts/package-deps-linux.sh --version "${{ inputs.version }}" --arch x64

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ASSET }}
          path: |
            dist/${{ env.ASSET }}.zip
            dist/${{ env.ASSET }}.zip.sha256.json

  # The v2 bundle's promise is that it runs on CPUs without AVX. Every hosted
  # runner has AVX2, so prove it by running every plugin under Intel SDE
  # emulating Westmere (the Mac Pro 5,1 from issue #92).
  gate-x64-v2:
    needs: build-x64
    uses: ./.github/workflows/probe-cpu-compat.yml
    with:
      artifact_prefix: VapourBox-deps-${{ inputs.version }}-
      tier: v2
      gate: true
      matrix_json: '[{"platform":"linux-x64","runner":"ubuntu-24.04","sde":"sde64","python":"python/bin/python3","chip":"wsm"}]'

  # Published only once the v2 gate has passed, so a bundle that would crash on
  # an older CPU never reaches a release.
  upload-x64:
    needs: [build-x64, gate-x64-v2]
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: VapourBox-deps-${{ inputs.version }}-linux-x64*
          path: dist
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            dist/VapourBox-deps-${{ inputs.version }}-linux-x64*.zip \
            dist/VapourBox-deps-${{ inputs.version }}-linux-x64*.zip.sha256.json --clobber

  build-arm64:
    if: ${{ inputs.arch == 'arm64' || inputs.arch == 'both' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake nasm patchelf autoconf automake libtool \
            cython3 pkg-config gcc g++ python3-pip \
            libfftw3-dev libboost-filesystem-dev libboost-atomic-dev \
            ocl-icd-opencl-dev opencl-headers libdvdread-dev unzip
          # ubuntu-24.04 ships gcc 13 and Cython 3, which is what VapourSynth
          # R78 needs: float16_helper.h uses _Float16 in C++ (GCC >= 13),
          # averageframesfilter.cpp uses __builtin_roundevenf, and
          # vapoursynth.pyx uses Cython 3 syntax. On 22.04 none of those were
          # available and each had to be worked around separately.
          gcc --version | head -1
          pip3 install meson

      - name: Build dependencies
        run: ./Scripts/download-deps-linux.sh --force

      - name: Package dependencies
        run: ./Scripts/package-deps-linux.sh --version "${{ inputs.version }}" --arch arm64

      - uses: actions/upload-artifact@v5
        with:
          name: VapourBox-deps-${{ inputs.version }}-linux-arm64
          path: |
            dist/VapourBox-deps-${{ inputs.version }}-linux-arm64.zip
            dist/VapourBox-deps-${{ inputs.version }}-linux-arm64.zip.sha256.json

      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            "dist/VapourBox-deps-${{ inputs.version }}-linux-arm64.zip" \
            "dist/VapourBox-deps-${{ inputs.version }}-linux-arm64.zip.sha256.json" --clobber
