name: Build Linux Deps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Deps version (e.g., 1.3.0)'
        required: true
        type: string
      release_tag:
        description: 'Upload to this release tag (e.g., deps-v1.3.0). Leave empty to skip upload.'
        required: false
        type: string
      arch:
        description: 'Architecture to build'
        required: false
        type: choice
        options:
          - both
          - x64
          - arm64
        default: both

permissions:
  contents: write

jobs:
  build-x64:
    if: ${{ inputs.arch == 'x64' || inputs.arch == 'both' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake nasm patchelf autoconf automake libtool \
            cython3 pkg-config gcc g++ python3-pip \
            libfftw3-dev libboost-filesystem-dev libboost-atomic-dev \
            ocl-icd-opencl-dev opencl-headers libdvdread-dev unzip
          # VapourSynth R78 needs a C++ toolchain newer than jammy's default:
          # src/core/float16_helper.h uses _Float16 in C++ (needs GCC >= 13) and
          # averageframesfilter.cpp uses __builtin_roundevenf (needs clang >= 17).
          # ubuntu-22.04 ships gcc 11 and has no gcc-13 in its repositories at
          # all, so this comes from apt.llvm.org — the route already proven to
          # work on jammy arm64. The rest of the deps build keeps using the
          # system gcc; only VapourSynth needs the newer compiler, and
          # download-deps-linux.sh picks it up if present.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19
          clang-19 --version | head -1
          pip3 install meson

      - name: Build dependencies
        run: ./Scripts/download-deps-linux.sh --force

      - name: Package dependencies
        run: ./Scripts/package-deps-linux.sh --version "${{ inputs.version }}" --arch x64

      - uses: actions/upload-artifact@v5
        with:
          name: VapourBox-deps-${{ inputs.version }}-linux-x64
          path: |
            dist/VapourBox-deps-${{ inputs.version }}-linux-x64.zip
            dist/VapourBox-deps-${{ inputs.version }}-linux-x64.zip.sha256.json

      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            "dist/VapourBox-deps-${{ inputs.version }}-linux-x64.zip" \
            "dist/VapourBox-deps-${{ inputs.version }}-linux-x64.zip.sha256.json" --clobber

  build-arm64:
    if: ${{ inputs.arch == 'arm64' || inputs.arch == 'both' }}
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake nasm patchelf autoconf automake libtool \
            cython3 pkg-config gcc g++ python3-pip \
            libfftw3-dev libboost-filesystem-dev libboost-atomic-dev \
            ocl-icd-opencl-dev opencl-headers libdvdread-dev unzip
          # VapourSynth R78 needs a C++ toolchain newer than jammy's default:
          # src/core/float16_helper.h uses _Float16 in C++ (needs GCC >= 13) and
          # averageframesfilter.cpp uses __builtin_roundevenf (needs clang >= 17).
          # ubuntu-22.04 ships gcc 11 and has no gcc-13 in its repositories at
          # all, so this comes from apt.llvm.org — the route already proven to
          # work on jammy arm64. The rest of the deps build keeps using the
          # system gcc; only VapourSynth needs the newer compiler, and
          # download-deps-linux.sh picks it up if present.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19
          clang-19 --version | head -1
          pip3 install meson

      - name: Build dependencies
        run: ./Scripts/download-deps-linux.sh --force

      - name: Package dependencies
        run: ./Scripts/package-deps-linux.sh --version "${{ inputs.version }}" --arch arm64

      - uses: actions/upload-artifact@v5
        with:
          name: VapourBox-deps-${{ inputs.version }}-linux-arm64
          path: |
            dist/VapourBox-deps-${{ inputs.version }}-linux-arm64.zip
            dist/VapourBox-deps-${{ inputs.version }}-linux-arm64.zip.sha256.json

      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            "dist/VapourBox-deps-${{ inputs.version }}-linux-arm64.zip" \
            "dist/VapourBox-deps-${{ inputs.version }}-linux-arm64.zip.sha256.json" --clobber
