# TEMPORARY (task #116): prove check-deps-plugins-load.ps1 fails on the
# published rc3 Windows bundle (no FFTW in vs-plugins\) and passes on task
# #101's rc4 candidate (build-deps-windows 44993117365). Removed before merge.
name: tmp-116-load-guard
on:
  workflow_dispatch:
  push:
    branches: [stuart/116-windows-ci-test-fails-on-main-deps-v1-18]
    paths: [.github/workflows/tmp-116-load-guard.yml]

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: [rc3-release, rc4-candidate]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch bundle
        shell: bash
        run: |
          mkdir -p zip bundle
          if [ "${{ matrix.bundle }}" = rc3-release ]; then
            gh release download deps-v1.18.0-rc3 -R "$GITHUB_REPOSITORY" \
              -p 'VapourBox-deps-1.18.0-rc3-windows-x64.zip' -D zip
          else
            gh run download 44993117365 -R "$GITHUB_REPOSITORY" \
              -n VapourBox-deps-1.18.0-rc4-windows-x64 -D zip
          fi
          7z x zip/*.zip -obundle -y >/dev/null
          ls bundle bundle/vapoursynth/vs-plugins | grep -i -E 'fftw|^vapoursynth|DCT' || true
      - name: Run the load guard
        shell: pwsh
        run: |
          ./Scripts/check-deps-plugins-load.ps1 -DepsDir bundle -PlatformKey windows-x64
          $code = $LASTEXITCODE
          Write-Host "guard exit: $code"
          $expect = if ("${{ matrix.bundle }}" -eq "rc3-release") { 1 } else { 0 }
          if ($code -ne $expect) { Write-Host "expected exit $expect"; exit 1 }
          exit 0
