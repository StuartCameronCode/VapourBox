name: Build Windows Deps

# Builds the VapourSynth/FFmpeg/Python dependency bundle for Windows x64.
# Mirrors build-deps-macos.yml / build-deps-linux.yml. Every plugin (incl.
# DeScratch and TemporalMedian) is fetched from upstream release URLs by
# download-deps-windows.ps1 (7-Zip is preinstalled on the windows-latest runner).
# No deps binaries are committed; the script reproduces the bundle from scratch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Deps version (e.g., 1.4.0)'
        required: true
        type: string
      release_tag:
        description: 'Upload to this release tag (e.g., deps-v1.4.0). Leave empty to skip upload.'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  # x64 ships in two CPU tiers (issue #92): v3 for x86-64-v3 CPUs, v2 for
  # anything older. Same script, one -Tier switch. Both are built in full, but
  # only v3 is published as a bundle: delta-x64 below reduces the v2 build to
  # the few files that differ (Scripts/make-deps-delta.py).
  build-x64:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [v3, v2]
    env:
      ASSET: VapourBox-deps-${{ inputs.version }}-windows-x64${{ matrix.tier == 'v2' && '-v2' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build dependencies (${{ matrix.tier }})
        shell: pwsh
        run: ./Scripts/download-deps-windows.ps1 -Tier ${{ matrix.tier }}

      - name: Package dependencies
        shell: pwsh
        run: ./Scripts/package-deps-windows.ps1 -Version "${{ inputs.version }}"

      # The v2 build is an intermediate ("-v2-build"): nothing downstream may
      # mistake it for a publishable bundle.
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ASSET }}${{ matrix.tier == 'v2' && '-build' || '' }}
          retention-days: ${{ matrix.tier == 'v2' && 3 || 90 }}
          path: |
            dist/${{ env.ASSET }}.zip
            dist/${{ env.ASSET }}.zip.sha256.json

  # Cut the v2 delta against the v3 bundle, and compose the tree a v2 user
  # ends up with (v3 bundle + delta) for the gate to test. Pure zip work, so it
  # runs on Linux like the other platforms' delta jobs.
  delta-x64:
    needs: build-x64
    runs-on: ubuntu-24.04
    env:
      STEM: VapourBox-deps-${{ inputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.STEM }}
          path: base
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.STEM }}-v2-build
          path: v2-build
      - name: Make the v2 delta
        run: |
          python3 Scripts/make-deps-delta.py --platform windows-x64 \
            --version "${{ inputs.version }}" \
            --base "base/$STEM.zip" --v2 "v2-build/$STEM-v2.zip" \
            --out dist --composed composed
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.STEM }}-v2-delta
          path: |
            dist/${{ env.STEM }}-v2-delta.zip
            dist/${{ env.STEM }}-v2-delta.zip.sha256.json
      # What the gate probes. Named as the gate expects a v2 bundle to be; never
      # uploaded to a release.
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.STEM }}-v2
          retention-days: 3
          path: composed/${{ env.STEM }}-v2.zip

  # The v2 tier must run below x86-64-v3, and every hosted runner has AVX2.
  # Windows is probed at Sandy Bridge (AVX without AVX2): at pre-AVX chips SDE
  # cannot emulate what Microsoft's runtime reads from the kernel, so the core
  # control fails and nothing could be proven (see probe-cpu-compat.yml). The
  # gate runs against the v3 bundle with the delta applied.
  gate-x64-v2:
    needs: delta-x64
    uses: ./.github/workflows/probe-cpu-compat.yml
    with:
      artifact_prefix: VapourBox-deps-${{ inputs.version }}-
      tier: v2
      gate: true
      matrix_json: '[{"platform":"windows-x64","runner":"windows-latest","sde":"sde.exe","python":"vapoursynth/python.exe","chip":"snb"}]'

  # Published only once the v2 gate has passed. Exactly four files: the v3
  # bundle, the v2 delta, and a sidecar each.
  upload-x64:
    needs: [build-x64, delta-x64, gate-x64-v2]
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    env:
      STEM: VapourBox-deps-${{ inputs.version }}-windows-x64
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.STEM }}
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.STEM }}-v2-delta
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            "dist/$STEM.zip" "dist/$STEM.zip.sha256.json" \
            "dist/$STEM-v2-delta.zip" "dist/$STEM-v2-delta.zip.sha256.json" --clobber
