name: Nightly Integration Tests

# Runs the heavy, full-encode Flutter integration tests (tagged `heavy`) that are
# excluded from the per-push CI gate (ci-test.yml). These run the worker
# end-to-end through `vspipe | ffmpeg` for every pipeline pass and verify real
# output properties (codecs, field order, audio streams, pixel format, trimming,
# subtitles). Same 4-platform matrix and deps/whisper provisioning as ci-test.yml.

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platforms to run (manual dispatch only)'
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
        default: all
      deps_run_id:
        description: 'Optional build-deps-* run IDs (comma-separated) to take the deps bundles from, instead of the release named in deps-version.json'
        required: false
        type: string

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

# See ci-test.yml: `actions: read` is what the deps_run_id path needs, and the
# repo's default token does not grant it.
permissions:
  contents: read
  actions: read

env:
  WHISPER_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin

jobs:
  macos:
    if: ${{ github.event_name == 'schedule' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        # x64 runs both CPU-tier bundles (issue #92). The runner is a v3 CPU, so
        # the v2 run proves the v2 bundle is functionally equivalent — not that
        # it runs on an older CPU; that is build-deps-macos.yml's static gate.
        include:
          - arch: arm64
            runner: macos-15
            asset: macos-arm64
          - arch: x64
            runner: macos-15-intel  # last native Intel image, available until ~Aug 2027
            asset: macos-x64
          - arch: x64
            runner: macos-15-intel
            asset: macos-x64-v2
    name: macos (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    env:
      VAPOURBOX_DEPS_DIR: ${{ github.workspace }}/deps/macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve deps tag
        id: deps
        run: |
          TAG=$(python3 -c "import json;print(json.load(open('app/assets/deps-version.json'))['releaseTag'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#deps-v}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download dependencies (${{ matrix.asset }})
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_RUN_ID: ${{ inputs.deps_run_id }}
        run: |
          # The tier is in the asset name only; either installs to deps/<platform>.
          PLATFORM="macos-${{ matrix.arch }}"
          mkdir -p "deps/$PLATFORM"
          ZIP=$(bash .github/scripts/fetch-deps-bundle.sh "${{ matrix.asset }}" \
            "${{ steps.deps.outputs.tag }}" "${{ steps.deps.outputs.ver }}")
          unzip -q -o "$ZIP" -d "deps/$PLATFORM"
          rm -rf "$ZIP" .deps-artifact
          xattr -cr "deps/$PLATFORM" 2>/dev/null || true

      - name: Cache whisper model
        uses: actions/cache@v5
        with:
          path: .whisper-cache
          key: whisper-ggml-small-v1

      - name: Provision whisper add-on
        run: |
          mkdir -p .whisper-cache addons/whisper/models
          if [ ! -f .whisper-cache/ggml-small.bin ]; then
            curl -L -o .whisper-cache/ggml-small.bin "$WHISPER_MODEL_URL"
          fi
          cp .whisper-cache/ggml-small.bin addons/whisper/models/ggml-small.bin
          brew install whisper-cpp
          BP="$(brew --prefix)"
          ln -sfn "$BP/opt/whisper-cpp/bin" addons/whisper/bin
          ln -sfn "$BP/opt/whisper-cpp/lib" addons/whisper/lib

      - name: Build worker (debug)
        run: cd worker && cargo build

      - name: Generate Dart serialization
        run: |
          cd app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Heavy integration tests
        # ToolLocator resolves the worker relative to the running executable,
        # which under `flutter test` is the test runner, not the app bundle. The
        # tests that drive WorkerManager for real therefore need this pointed at
        # the built binary; without it they fail with "Worker executable not
        # found" and prove nothing.
        env:
          VAPOURBOX_WORKER: ${{ github.workspace }}/worker/target/debug/vapourbox-worker
        run: cd app && flutter test --tags heavy

  windows:
    if: ${{ github.event_name == 'schedule' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    # Both CPU-tier bundles (issue #92); see the macOS job for what the v2 run proves.
    strategy:
      fail-fast: false
      matrix:
        asset: [windows-x64, windows-x64-v2]
    name: windows (${{ matrix.asset }})
    runs-on: windows-latest
    env:
      VAPOURBOX_DEPS_DIR: ${{ github.workspace }}/deps/windows-x64
    steps:
      - uses: actions/checkout@v5

      - name: Resolve deps tag
        id: deps
        shell: bash
        run: |
          TAG=$(python -c "import json;print(json.load(open('app/assets/deps-version.json'))['releaseTag'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#deps-v}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download dependencies (windows-x64)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_RUN_ID: ${{ inputs.deps_run_id }}
        run: |
          mkdir -p deps/windows-x64
          ZIP=$(bash .github/scripts/fetch-deps-bundle.sh "${{ matrix.asset }}" \
            "${{ steps.deps.outputs.tag }}" "${{ steps.deps.outputs.ver }}")
          7z x "$ZIP" -o"deps/windows-x64" -y >/dev/null
          rm -rf "$ZIP" .deps-artifact

      - name: Cache whisper model
        uses: actions/cache@v5
        with:
          path: .whisper-cache
          key: whisper-ggml-small-v1

      - name: Provision whisper add-on
        shell: bash
        run: |
          mkdir -p .whisper-cache addons/whisper/models
          if [ ! -f .whisper-cache/ggml-small.bin ]; then
            curl -L -o .whisper-cache/ggml-small.bin "$WHISPER_MODEL_URL"
          fi
          cp .whisper-cache/ggml-small.bin addons/whisper/models/ggml-small.bin
          curl -L -o /tmp/whisper-win.zip \
            "https://github.com/ggml-org/whisper.cpp/releases/download/v1.8.3/whisper-bin-x64.zip"
          7z x /tmp/whisper-win.zip -o/tmp/whisper-win -y >/dev/null
          CLI=$(find /tmp/whisper-win -name "whisper-cli.exe" | head -1)
          cp "$(dirname "$CLI")"/*.exe addons/whisper/ 2>/dev/null || true
          cp "$(dirname "$CLI")"/*.dll addons/whisper/ 2>/dev/null || true

      - name: Build worker (debug)
        run: cd worker && cargo build

      - name: Generate Dart serialization
        run: |
          cd app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Heavy integration tests
        # See the macOS job: ToolLocator needs the worker path under
        # `flutter test`, where the running executable is the test runner.
        env:
          VAPOURBOX_WORKER: ${{ github.workspace }}\worker\target\debug\vapourbox-worker.exe
        run: cd app && flutter test --tags heavy

  linux:
    if: ${{ github.event_name == 'schedule' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    # Both CPU-tier bundles (issue #92); see the macOS job for what the v2 run proves.
    strategy:
      fail-fast: false
      matrix:
        asset: [linux-x64, linux-x64-v2]
    name: linux (${{ matrix.asset }})
    runs-on: ubuntu-24.04  # must match the deps-build runner (glibc)
    env:
      VAPOURBOX_DEPS_DIR: ${{ github.workspace }}/deps/linux-x64
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev unzip

      - name: Resolve deps tag
        id: deps
        run: |
          TAG=$(python3 -c "import json;print(json.load(open('app/assets/deps-version.json'))['releaseTag'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#deps-v}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download dependencies (${{ matrix.asset }})
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_RUN_ID: ${{ inputs.deps_run_id }}
        run: |
          mkdir -p deps/linux-x64
          ZIP=$(bash .github/scripts/fetch-deps-bundle.sh "${{ matrix.asset }}" \
            "${{ steps.deps.outputs.tag }}" "${{ steps.deps.outputs.ver }}")
          unzip -q -o "$ZIP" -d deps/linux-x64
          rm -rf "$ZIP" .deps-artifact

      - name: Cache whisper model
        uses: actions/cache@v5
        with:
          path: .whisper-cache
          key: whisper-ggml-small-v1

      - name: Provision whisper add-on
        run: |
          mkdir -p .whisper-cache addons/whisper/models addons/whisper/bin
          if [ ! -f .whisper-cache/ggml-small.bin ]; then
            curl -L -o .whisper-cache/ggml-small.bin "$WHISPER_MODEL_URL"
          fi
          cp .whisper-cache/ggml-small.bin addons/whisper/models/ggml-small.bin
          WHISPER_URL=$(python3 -c "import json;print(json.load(open('app/assets/whisper-addon.json'))['binary']['platforms']['linux-x64']['url'])")
          curl -L -o /tmp/whisper-cli.tar.gz "$WHISPER_URL"
          tar xzf /tmp/whisper-cli.tar.gz -C addons/whisper
          chmod +x addons/whisper/bin/whisper-cli

      - name: Stage deps/addons at XDG path for the Rust locator
        run: |
          mkdir -p "$HOME/.local/share/VapourBox"
          ln -sfn "${{ github.workspace }}/deps" "$HOME/.local/share/VapourBox/deps"
          ln -sfn "${{ github.workspace }}/addons" "$HOME/.local/share/VapourBox/addons"

      - name: Build worker (debug)
        run: cd worker && cargo build

      - name: Generate Dart serialization
        run: |
          cd app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Heavy integration tests
        # ToolLocator resolves the worker relative to the running executable,
        # which under `flutter test` is the test runner, not the app bundle. The
        # tests that drive WorkerManager for real therefore need this pointed at
        # the built binary; without it they fail with "Worker executable not
        # found" and prove nothing.
        env:
          VAPOURBOX_WORKER: ${{ github.workspace }}/worker/target/debug/vapourbox-worker
        run: cd app && flutter test --tags heavy
