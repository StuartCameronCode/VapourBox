name: Build macOS Deps

# Builds the VapourSynth/FFmpeg/Python dependency bundles for macOS.
#
#   - arm64 builds natively on macos-15 (Apple Silicon).
#   - x64 builds natively on macos-15-intel (the last native Intel image,
#     available until ~Aug 2027). FFmpeg comes pre-built from evermeet.cx and
#     most plugins from Stefan-Olt; see Scripts/download-deps-macos.sh.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Deps version (e.g., 1.3.0)'
        required: true
        type: string
      release_tag:
        description: 'Upload to this release tag (e.g., deps-v1.3.0). Leave empty to skip upload.'
        required: false
        type: string
      arch:
        description: 'Architecture to build'
        required: false
        type: choice
        options:
          - both
          - arm64
          - x64
        default: both

permissions:
  contents: write

jobs:
  build-arm64:
    if: ${{ inputs.arch == 'arm64' || inputs.arch == 'both' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build dependencies (arm64, native)
        run: ./Scripts/download-deps-macos.sh --force

      - name: Package dependencies
        run: ./Scripts/package-deps-macos.sh --version "${{ inputs.version }}" --arch arm64

      - uses: actions/upload-artifact@v5
        with:
          name: VapourBox-deps-${{ inputs.version }}-macos-arm64
          path: |
            dist/VapourBox-deps-${{ inputs.version }}-macos-arm64.zip
            dist/VapourBox-deps-${{ inputs.version }}-macos-arm64.zip.sha256.json

      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            "dist/VapourBox-deps-${{ inputs.version }}-macos-arm64.zip" \
            "dist/VapourBox-deps-${{ inputs.version }}-macos-arm64.zip.sha256.json" --clobber

  # x64 ships in two CPU tiers (issue #92): v3 for x86-64-v3 CPUs, v2 for
  # anything older. Same script, one --tier switch. Both are built in full, but
  # only v3 is published as a bundle: delta-x64 below reduces the v2 build to
  # the few files that differ (Scripts/make-deps-delta.py).
  #
  # The v2 build is gated by package-deps-macos.sh itself
  # (Scripts/check-load-time-simd.py): macOS has no Intel SDE, so it proves
  # statically that no plugin runs AVX while it loads — and fails this job, so
  # nothing below can publish a delta cut from it. The check covers every
  # plugin the v2 build holds; the ones outside the delta are the same sources
  # and binaries the v3 bundle was built from.
  build-x64:
    if: ${{ inputs.arch == 'x64' || inputs.arch == 'both' }}
    runs-on: macos-15-intel  # only hosted Intel image (macos-13 retired; last one until ~Aug 2027)
    strategy:
      fail-fast: false
      matrix:
        tier: [v3, v2]
    env:
      ASSET: VapourBox-deps-${{ inputs.version }}-macos-x64${{ matrix.tier == 'v2' && '-v2' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build dependencies (x64 ${{ matrix.tier }}, native)
        # STRICT_MIN_OS=1: fail the build if any bundled Mach-O targets newer than
        # the macOS 12 floor (issue #39) instead of silently shipping it.
        env:
          STRICT_MIN_OS: "1"
        run: ./Scripts/download-deps-macos.sh --force --tier ${{ matrix.tier }}

      - name: Package dependencies
        run: ./Scripts/package-deps-macos.sh --version "${{ inputs.version }}" --arch x64

      # The v2 build is an intermediate ("-v2-build"): nothing downstream may
      # mistake it for a publishable bundle.
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ASSET }}${{ matrix.tier == 'v2' && '-build' || '' }}
          retention-days: ${{ matrix.tier == 'v2' && 3 || 90 }}
          path: |
            dist/${{ env.ASSET }}.zip
            dist/${{ env.ASSET }}.zip.sha256.json

  # Cut the v2 delta against the v3 bundle, then publish both. Runs on macOS so
  # the composed tree can be put through the same load-time check the v2 build
  # passed, this time on exactly what a v2 user ends up with.
  delta-x64:
    needs: build-x64
    runs-on: macos-15
    env:
      STEM: VapourBox-deps-${{ inputs.version }}-macos-x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.STEM }}
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.STEM }}-v2-build
          path: v2-build
      - name: Make the v2 delta
        run: |
          python3 Scripts/make-deps-delta.py --platform macos-x64 \
            --version "${{ inputs.version }}" \
            --base "dist/$STEM.zip" --v2 "v2-build/$STEM-v2.zip" \
            --out dist --composed composed

      - name: Gate the composed v2 tree (no AVX at load time)
        run: |
          mkdir composed-tree
          unzip -q "composed/$STEM-v2.zip" -d composed-tree
          python3 Scripts/check-load-time-simd.py composed-tree/vapoursynth/plugins/*.dylib

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.STEM }}-v2-delta
          path: |
            dist/${{ env.STEM }}-v2-delta.zip
            dist/${{ env.STEM }}-v2-delta.zip.sha256.json

      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            "dist/$STEM.zip" "dist/$STEM.zip.sha256.json" \
            "dist/$STEM-v2-delta.zip" "dist/$STEM-v2-delta.zip.sha256.json" --clobber
