name: Probe DFTTest FFTW plans (task #101, temporary)

# TEMPORARY (task #101): delete before merge. Runs
# docs/reports/task-101-dfttest-fftw-planning/scripts on every platform,
# against two bundles: the published 1.18.0-rc3 (DFTTest with FFTW_PATIENT)
# and a build-deps-* run of this branch (FFTW_ESTIMATE, deps_run_id):
# distinct pictures across fresh processes, how far apart, whether DFTTest
# and FFT3DFilter share an FFTW problem, and speed. Several Windows and Linux
# jobs sample different runner CPUs. (Push re-runs it: run 2.)

on:
  workflow_dispatch:
    inputs:
      deps_run_id:
        description: 'Comma-separated build-deps-* run IDs of this branch (the ESTIMATE bundles)'
        required: false
        type: string
      processes:
        description: 'Fresh processes per bundle'
        default: '20'
      speed_runs:
        description: 'speed.py runs per bundle'
        default: '3'

  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/probe-dfttest-fftw.yml'

permissions:
  contents: read
  actions: read

env:
  PROCESSES: ${{ inputs.processes || '20' }}
  SPEED_RUNS: ${{ inputs.speed_runs || '3' }}
  S: docs/reports/task-101-dfttest-fftw-planning/scripts

jobs:
  probe:
    name: ${{ matrix.platform }} ${{ matrix.n }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64, n: 1 }
          - { os: windows-latest, platform: windows-x64, n: 2 }
          - { os: windows-latest, platform: windows-x64, n: 3 }
          - { os: ubuntu-24.04, platform: linux-x64, n: 1 }
          - { os: ubuntu-24.04, platform: linux-x64, n: 2 }
          - { os: macos-15-intel, platform: macos-x64, n: 1 }
          - { os: macos-15, platform: macos-arm64, n: 1 }
    steps:
      - uses: actions/checkout@v5

      - name: CPU
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
            Linux) grep -m1 'model name' /proc/cpuinfo ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
          esac

      - name: Install both bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P="${{ matrix.platform }}"
          DEPS_RUN_ID= bash .github/scripts/install-deps-bundle.sh "$P" deps-v1.18.0-rc3 1.18.0-rc3 deps/patient
          DEPS_RUN_ID="${{ inputs.deps_run_id || '44993114953,44993117365,44993119509' }}" bash .github/scripts/install-deps-bundle.sh "$P" \
            deps-v1.18.0-rc4 1.18.0-rc4 deps/estimate
          if [ "$RUNNER_OS" = macOS ]; then xattr -cr deps 2>/dev/null || true; fi
          cat deps/patient/version.json deps/estimate/version.json

      - name: Probe (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out
          export SCRATCH="$RUNNER_TEMP/task101"
          for b in patient estimate; do
            bash $S/run.sh deps/$b probe.py "$PROCESSES" "$RUNNER_TEMP/dump-$b" > out/probe-$b.json
            bash $S/run.sh deps/$b wisdom_probe.py 3 > out/wisdom-$b.json
          done
          bash $S/speed_runs.sh deps/patient deps/estimate "$SPEED_RUNS" > out/speed.jsonl
          mkdir -p "$RUNNER_TEMP/all-patient" "$RUNNER_TEMP/all-estimate"
          for i in 1 2 3 4 5; do bash $S/run.sh deps/patient xproc.py "$RUNNER_TEMP/all-patient" all > /dev/null; done
          bash $S/run.sh deps/estimate xproc.py "$RUNNER_TEMP/all-estimate" all > /dev/null
          python3 $S/compare.py "$RUNNER_TEMP/all-patient" "$RUNNER_TEMP/all-estimate" > out/move.json

      - name: Probe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $env:SCRATCH = Join-Path $env:RUNNER_TEMP 'task101'
          foreach ($b in 'patient', 'estimate') {
            & "$env:S/run.ps1" "deps/$b" probe.py $env:PROCESSES (Join-Path $env:RUNNER_TEMP "dump-$b") | Out-File -Encoding utf8 "out/probe-$b.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$env:S/run.ps1" "deps/$b" wisdom_probe.py 3 | Out-File -Encoding utf8 "out/wisdom-$b.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $lines = @()
          for ($i = 1; $i -le [int]$env:SPEED_RUNS; $i++) {
            foreach ($b in 'patient', 'estimate') {
              $r = & "$env:S/run.ps1" "deps/$b" speed.py 120
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $lines += "{`"build`": `"$b`", `"result`": $($r | Select-Object -Last 1)}"
            }
          }
          $lines | Out-File -Encoding utf8 out/speed.jsonl
          $ap = Join-Path $env:RUNNER_TEMP 'all-patient'; $ae = Join-Path $env:RUNNER_TEMP 'all-estimate'
          New-Item -ItemType Directory -Force -Path $ap, $ae | Out-Null
          for ($i = 1; $i -le 5; $i++) {
            & "$env:S/run.ps1" deps/patient xproc.py $ap all | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & "$env:S/run.ps1" deps/estimate xproc.py $ae all | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$env:S/compare.py" $ap $ae | Out-File -Encoding utf8 out/move.json

      - name: Summary
        if: always()
        shell: bash
        run: python3 $S/summarize.py out 2>/dev/null || python $S/summarize.py out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.platform }}-${{ matrix.n }}
          path: out/
