name: CI Tests

# The pull-request gate, aimed at about 10 minutes (task #84). Each platform
# runs two jobs side by side, both against the published deps bundle:
#
#   * rust    — `cargo test` (the whisper subtitle test is #[ignore]d: it
#               needs the whisper add-on and minutes of CPU, nightly runs it).
#   * flutter — `flutter test --exclude-tags heavy,gpu`: unit, widget and
#               script tests and the short shell-outs. The worker binary the
#               shell-outs run is built in the background while Flutter is set
#               up. Linux also runs the format sweep's smoke rows
#               (`sweep-smoke`, one tiny preview per variant); macOS and Windows
#               exclude that tag. When the run touches the deps bundle, the
#               plugin format table or the probe (.github/scripts/deps-sensitive.sh),
#               it also runs the quick plugin format probe, which is otherwise
#               nightly only.
#
# The heavy full-encode tests, the full format sweep and both plugin probes run
# in nightly.yml; `gpu` tests run on no hosted runner (app/dart_test.yaml).
#
# Caches (the repository's 10 GB is shared with nightly): Cargo dependencies
# (Swatinem/rust-cache) and the pub cache, saved from main only and restored
# everywhere. The Flutter SDK is not cached: at ~2 GB a platform it pushed the
# total over 10 GB, so caches were evicted, and a hit saved under 30 s.
#
# macOS is tested natively on arm64 (macos-15) and x64 (macos-15-intel);
# Windows on x64; Linux on x64 (ubuntu-24.04).

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'licenses/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'licenses/**']
  workflow_dispatch:
    inputs:
      deps_run_id:
        description: 'Optional build-deps-* run IDs (comma-separated) to take the deps bundles from, instead of the release named in deps-version.json'
        required: false
        type: string
      save_caches:
        description: 'Save the Cargo and pub caches from this ref too (main always does). For measuring a warm run on a branch.'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

# `actions: read` is what `gh run download` needs for the deps_run_id path
# below. The repo default is the restricted token (contents + packages read,
# everything else none), so without this an artifact fetch 404s. Deliberately
# read-only: pulling an unpublished bundle must not require a write-scoped
# token on a workflow that runs against pull requests.
permissions:
  contents: read
  actions: read

env:
  SAVE_CACHES: ${{ github.ref == 'refs/heads/main' || inputs.save_caches == true }}

jobs:
  rust:
    name: rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: macos-arm64, runner: macos-15}
          - {platform: macos-x64, runner: macos-15-intel}  # last native Intel image, until ~Aug 2027
          - {platform: windows-x64, runner: windows-latest}
          - {platform: linux-x64, runner: ubuntu-24.04}    # must match the deps-build runner (glibc)
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Keep core dumps (for the crash report)
        # A vspipe crash otherwise leaves only "signal 11" (task #66).
        if: runner.os == 'Linux'
        run: bash .github/scripts/enable-core-dumps.sh

      - name: Resolve deps tag
        id: deps
        run: |
          TAG=$(python3 -c "import json;print(json.load(open('app/assets/deps-version.json'))['releaseTag'])" 2>/dev/null \
             || python -c "import json;print(json.load(open('app/assets/deps-version.json'))['releaseTag'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#deps-v}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: worker -> target
          key: ${{ matrix.platform }}-test
          save-if: ${{ env.SAVE_CACHES == 'true' }}

      - name: Download dependencies (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_RUN_ID: ${{ inputs.deps_run_id }}
        run: |
          bash .github/scripts/install-deps-bundle.sh "${{ matrix.platform }}" \
            "${{ steps.deps.outputs.tag }}" "${{ steps.deps.outputs.ver }}" "deps/${{ matrix.platform }}"
          if [ "$RUNNER_OS" = macOS ]; then xattr -cr "deps/${{ matrix.platform }}" 2>/dev/null || true; fi

      - name: Stage deps at the XDG path for the Rust locator
        # The Rust DependencyLocator on Linux only looks under
        # ~/.local/share/VapourBox (no debug upward search).
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/share/VapourBox" addons
          ln -sfn "${{ github.workspace }}/deps" "$HOME/.local/share/VapourBox/deps"
          ln -sfn "${{ github.workspace }}/addons" "$HOME/.local/share/VapourBox/addons"

      - name: Rust tests
        # Debug build: DependencyLocator's upward search then finds the repo-root
        # deps/ (release mode looks under ~/Library).
        run: cd worker && cargo test -- --nocapture

      - name: Crash reports (on failure)
        # macOS: the .ips reports name the library and function; Linux: gdb
        # over the cores kept above.
        if: failure() && runner.os != 'Windows'
        run: python3 .github/scripts/print-crash-reports.py

  flutter:
    name: flutter (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `jobs`: flutter test --concurrency. package:test's default is half
          # the cores, which is one file at a time on the 3-core arm64 runner,
          # and most of these files wait on a worker or vspipe, not the CPU.
          - {platform: macos-arm64, runner: macos-15, jobs: 3, exclude: 'heavy,gpu,sweep-smoke'}
          - {platform: macos-x64, runner: macos-15-intel, jobs: 4, exclude: 'heavy,gpu,sweep-smoke'}
          - {platform: windows-x64, runner: windows-latest, jobs: 4, exclude: 'heavy,gpu,sweep-smoke'}
          # Linux runs the format sweep's smoke rows: the fastest runner.
          - {platform: linux-x64, runner: ubuntu-24.04, jobs: 4, exclude: 'heavy,gpu'}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # Point the Flutter ToolLocator/DependencyManager at the repo-root deps
      # (Platform.resolvedExecutable is the test runner under `flutter test`).
      VAPOURBOX_DEPS_DIR: ${{ github.workspace }}/deps/${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          # deps-sensitive.sh diffs HEAD^1..HEAD (on a PR, the base branch
          # against GitHub's merge commit).
          fetch-depth: 2

      - name: Keep core dumps (for the crash report)
        if: runner.os == 'Linux'
        run: bash .github/scripts/enable-core-dumps.sh

      - name: Resolve deps tag
        id: deps
        run: |
          TAG=$(python3 -c "import json;print(json.load(open('app/assets/deps-version.json'))['releaseTag'])" 2>/dev/null \
             || python -c "import json;print(json.load(open('app/assets/deps-version.json'))['releaseTag'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#deps-v}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: worker -> target
          key: ${{ matrix.platform }}-build
          save-if: ${{ env.SAVE_CACHES == 'true' }}

      - name: Build the worker (in the background)
        # Overlaps Flutter's setup and code generation. "Wait for the worker
        # build" below runs `cargo build` again in the foreground: it waits on
        # Cargo's lock while this one finishes, or builds it itself if this
        # process did not survive the step.
        run: |
          mkdir -p "$RUNNER_TEMP"
          (cd worker && nohup cargo build > "$RUNNER_TEMP/worker-build.log" 2>&1 &)

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          pub-cache-path: ${{ runner.temp }}/pub-cache

      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-${{ matrix.platform }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: pub-${{ matrix.platform }}-

      - name: Download dependencies (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_RUN_ID: ${{ inputs.deps_run_id }}
        run: |
          bash .github/scripts/install-deps-bundle.sh "${{ matrix.platform }}" \
            "${{ steps.deps.outputs.tag }}" "${{ steps.deps.outputs.ver }}" "deps/${{ matrix.platform }}"
          if [ "$RUNNER_OS" = macOS ]; then xattr -cr "deps/${{ matrix.platform }}" 2>/dev/null || true; fi

      - name: Stage deps at the XDG path for the Rust locator
        # The worker the tests run reads deps from here on Linux.
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/share/VapourBox" addons
          ln -sfn "${{ github.workspace }}/deps" "$HOME/.local/share/VapourBox/deps"
          ln -sfn "${{ github.workspace }}/addons" "$HOME/.local/share/VapourBox/addons"

      - name: Generate Dart serialization
        run: |
          cd app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Wait for the worker build
        run: |
          cd worker && cargo build
          echo "--- background build log (tail) ---"
          tail -n 5 "$RUNNER_TEMP/worker-build.log" 2>/dev/null || echo "(none)"

      - name: Flutter tests
        # Excludes @Tags(['heavy']) (nightly.yml) and @Tags(['gpu']) (no
        # Vulkan device on these runners; dart_test.yaml).
        run: cd app && flutter test --concurrency=${{ matrix.jobs }} --exclude-tags ${{ matrix.exclude }}

      - name: Does this run touch the deps bundle or the probe table?
        id: sensitive
        if: success()
        env:
          DEPS_RUN_ID: ${{ inputs.deps_run_id }}
        run: echo "run=$(bash .github/scripts/deps-sensitive.sh)" >> "$GITHUB_OUTPUT"

      - name: Quick plugin format probe (deps bundle / table / probe changed)
        # Nightly only otherwise (task #84): it checks the bundle against
        # Tests/TestResources/plugin_format_table.json, which a pull request
        # only changes by changing one of them.
        if: success() && steps.sensitive.outputs.run == 'true'
        run: cd app && flutter test --tags heavy test/plugin_format_contracts_test.dart

      - name: Save pub cache
        if: always() && env.SAVE_CACHES == 'true' && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-${{ matrix.platform }}-${{ hashFiles('app/pubspec.yaml') }}

      - name: Crash reports (on failure)
        # A plugin that segfaults in vspipe shows only "signal 11" in the test
        # output; macOS's crash report names the library and function (Linux:
        # gdb over the kept cores).
        if: failure() && runner.os != 'Windows'
        run: python3 .github/scripts/print-crash-reports.py

      - name: Keep the raw crash reports (on failure)
        # The .ips files themselves, for symbolication or a second look: the
        # step above prints only their top frames (task #72).
        if: failure() && runner.os == 'macOS'
        run: |
          mkdir -p crash-reports
          for f in ~/Library/Logs/DiagnosticReports/{vspipe-bin,python3,vapourbox-worker}*.ips; do
            [ -f "$f" ] && cp "$f" crash-reports/
          done
          ls crash-reports

      - name: Upload the raw crash reports (on failure)
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: crash-reports-${{ matrix.platform }}
          path: crash-reports/*.ips
          if-no-files-found: ignore
          retention-days: 14
