# Test tag declarations for `flutter test`.
#
# The `heavy` tag marks tests too slow for the pull-request gate, which run
# nightly instead: the full-encode integration tests (test/integration_*_test.dart
# that run the worker end-to-end through vspipe | ffmpeg) and, since task #84,
# the quick and full plugin format probes, which check the deps bundle against
# Tests/TestResources/plugin_format_table.json. The per-push CI gate
# (ci-test.yml) runs `flutter test --exclude-tags heavy,gpu`, plus the quick
# probe when .github/scripts/deps-sensitive.sh says the run touches the bundle,
# the table or the probe; nightly.yml runs `flutter test --tags heavy`. Run them
# locally with either filter.
#
# The `gpu` tag marks tests that run RIFE or AI upscaling (ncnn on Vulkan), so
# need a Vulkan device. The hosted CI runners have no GPU, so both workflows
# exclude it (`--exclude-tags heavy,gpu`, `--tags heavy --exclude-tags gpu`).
# A plain local `flutter test` includes them; they skip, saying why, where the
# probe finds no device, and fail instead under VAPOURBOX_EXPECT_VULKAN=1. Run
# them alone with `flutter test --tags gpu`.
tags:
  heavy:
    # Too slow for the push gate (full encodes, the plugin format probes) — nightly.
  gpu:
    # Needs a Vulkan device (RIFE, AI upscaling) — excluded on the GPU-less CI runners.
  sweep:
    # The generated format sweep's full product (integration_format_sweep_test.dart,
    # task #47). Every sweep test is also `heavy`; nightly runs it as its own
    # job (`--tags sweep --exclude-tags gpu`) and the heavy job excludes it.
  sweep-smoke:
    # The format sweep's pull-request rows (task #84): one tiny preview per
    # variant, runs and depth only. Not heavy; ci-test.yml runs them on its
    # Linux job and the macOS and Windows jobs exclude the tag.
